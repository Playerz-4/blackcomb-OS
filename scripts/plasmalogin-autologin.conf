# Autologin for the Fedora live session.
# Keep both the global keys and the per-seat override: Plasma Login Manager
# supports named [Autologin][seatN] groups, but older builds only read the
# global group. Relogin must be true so autologin is attempted even when PLM
# cannot read the systemd soft-reboot counter (it otherwise falls back to the
# greeter and asks for the live user's password).
[Autologin]
User=liveuser
Session=plasma.desktop
Relogin=true

[Autologin][seat0]
User=liveuser
Session=plasma.desktop
Relogin=true
