# Blackcomb live greeter wallpaper. /etc/plasmalogin.conf.d is read after the
# distribution defaults, so these values win for Plasma Login Manager builds
# that honor drop-ins. patch-lock-screen-wallpaper.sh also writes the main
# /etc/plasmalogin.conf, which some releases require. The image is copied into
# the writable live root by the pre-pivot hook.
[Greeter]
WallpaperPluginId=org.kde.image
WallpaperPlugin=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/backgrounds/blackcomb/kim-stargazer.png
PreviewImage=file:///usr/share/backgrounds/blackcomb/kim-stargazer.png
