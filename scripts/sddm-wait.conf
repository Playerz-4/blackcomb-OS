[Unit]
# Fedora 43/45: SDDM can start before Plymouth releases the DRM device. KWin
# then fails to open /dev/dri/card and Plasma never paints (RHBZ 2404966).
# Keep rhgb/Plymouth, but wait for Plymouth to quit and let the guest GPU
# driver settle before starting the greeter/session.
After=plymouth-quit.service plymouth-quit-wait.service

[Service]
ExecStartPre=/bin/sleep 5
