# chafa backend: show the supplied crescent moon PNG as a real terminal image.
# Installed as /usr/local/lib/blackcomb/neofetch/chafa.conf by setup-blackcomb.sh
# and selected by /usr/local/bin/neofetch when chafa and ImageMagick are present.
image_backend="chafa"
image_source="/usr/share/blackcomb/branding/crescent-moon-start-icon.png"
image_size="35%"
crop_mode="normal"
gap=3
