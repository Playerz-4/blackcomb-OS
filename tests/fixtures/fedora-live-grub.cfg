# Representative Kiwi live menu
set default="1"
if [ "$grub_platform" == "efi" ]; then
    set basicgfx="nomodeset"
else
    set basicgfx="nomodeset vga=791"
fi
set timeout=10
search --file --set=root /boot/0xf3aa2021
menuentry "Start Fedora-KDE-Live" --class fedora --class gnu-linux --class gnu --class os {
    linux ($root)/boot/x86_64/loader/linux quiet rhgb root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image
    initrd ($root)/boot/x86_64/loader/initrd
}
menuentry "Test this media & start Fedora-KDE-Live" --class fedora --class gnu-linux --class gnu --class os {
    linux ($root)/boot/x86_64/loader/linux quiet rhgb root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image rd.live.check
    initrd ($root)/boot/x86_64/loader/initrd
}
submenu "Troubleshooting -->" {
    menuentry "Start Fedora-KDE-Live in basic graphics mode" --class fedora --class gnu-linux --class gnu --class os {
        linux ($root)/boot/x86_64/loader/linux quiet rhgb root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image ${basicgfx}
        initrd ($root)/boot/x86_64/loader/initrd
    }
}
