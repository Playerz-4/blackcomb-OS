[Unit]
# Fedora 43/45: the display manager can start before Plymouth releases the
# DRM device. KWin then cannot open /dev/dri/card and Plasma never paints
# (RHBZ 2404966). Keep rhgb/Plymouth, but wait for plymouth-quit.service only;
# plymouth-quit-wait.service is ordered after the display manager and adding
# it here can create a systemd ordering cycle.
After=plymouth-quit.service

[Service]
ExecStartPre=/bin/sleep 5
