[Unit]
# Fedora 44+ KDE uses Plasma Login Manager instead of SDDM. It has the same
# Plymouth/DRM race as SDDM (RHBZ 2404966). Wait for Plymouth to release the
# GPU before starting, so the splash and Plasma can both work.
After=plymouth-quit.service

[Service]
ExecStartPre=/bin/sleep 5
# Reinstate autologin and the Kim wallpaper after live-media setup writes the
# main config. Some PLM releases ignore /etc/plasmalogin.conf.d, so this patches
# the main file. A leading '-' keeps a missing helper from blocking the greeter.
ExecStartPre=-/bin/sh /usr/local/bin/blackcomb-lock-screen-wallpaper / --live-autologin
