name: Test VirtualBox workaround

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test display workaround without a VM
        shell: pwsh
        run: ./tests/test-virtualbox-workaround.ps1
